background {
  monitor=
  blur_passes=1
  path=screenshot
}

general {
  hide_cursor=true
}

input-field {
  monitor=
  size=250, 60
  dots_size=0.200000
  dots_spacing=0.200000
  fade_on_empty=false
  font_color=rgb(200, 200, 200)
  font_family=M+1Code Nerd Font
  halign=center
  hide_input=false
  inner_color=rgba(100, 114, 125, 0.4)
  outer_color=rgba(0, 0, 0, 0)
  outline_thickness=2
  placeholder_text=<i>Enter Password</i>
  position=0, -150
  valign=center
}

label {
  monitor=
  color=rgba(216, 222, 233, 0.70)
  font_family=Hack Nerd Font Mono
  font_size=130
  halign=center
  position=0, 240
  text=cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
  valign=center
}

label {
  monitor=
  color=rgba(216, 222, 233, 0.70)
  font_family=M+1Code Nerd Font
  font_size=30
  halign=center
  position=0, 105
  text=cmd[update:1000] echo -e "$(date +"%A, %d %B")"
  valign=center
}
